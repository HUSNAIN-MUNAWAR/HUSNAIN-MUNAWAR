      <tspan x="834" dy="23">reproducible data treated as core features.</tspan>
    </text>
    <text x="834" y="324" fill="#2DD4BF" font-size="12" font-weight="700" letter-spacing="1.2">TEST · OBSERVE · IMPROVE</text>
