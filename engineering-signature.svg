  <g font-family="Arial, Helvetica, sans-serif">
    <text x="92" y="231" fill="#F8FAFC" font-size="20" font-weight="800">Evidence before claims</text>
    <text x="92" y="264" fill="#CBD5E1" font-size="14">
      <tspan x="92" dy="0">Measurable outputs, evaluation, evidence</tspan>
      <tspan x="92" dy="23">capture, review workflows and audit trails.</tspan>
    </text>
    <text x="92" y="324" fill="#A78BFA" font-size="12" font-weight="700" letter-spacing="1.2">MEASURE · VERIFY · TRACE</text>

    <text x="463" y="231" fill="#F8FAFC" font-size="20" font-weight="800">Product before demo</text>
    <text x="463" y="264" fill="#CBD5E1" font-size="14">
