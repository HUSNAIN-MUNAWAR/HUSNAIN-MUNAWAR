      <tspan x="463" dy="23">dashboards, queues and operator actions.</tspan>
    </text>
    <text x="463" y="324" fill="#22D3EE" font-size="12" font-weight="700" letter-spacing="1.2">INTEGRATE · OPERATE · DELIVER</text>

