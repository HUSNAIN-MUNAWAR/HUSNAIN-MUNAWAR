    <text x="600" y="638" text-anchor="middle" fill="#F8FAFC" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="800">REAL-WORLD IMPACT</text>
    <text x="600" y="659" text-anchor="middle" fill="#CBD5E1" font-size="12" font-family="Arial, Helvetica, sans-serif">safer operations · faster decisions · auditable automation</text>
