    <text x="600" y="122" text-anchor="middle" fill="#CBD5E1" font-size="13" font-family="Arial, Helvetica, sans-serif">research → architecture → deployment</text>
  </g>

  <path d="M600 158V198" stroke="url(#line)" stroke-width="3"/>
  <path d="M600 198H225V226" stroke="url(#line)" stroke-width="3"/>
  <path d="M600 198V226" stroke="url(#line)" stroke-width="3"/>
  <path d="M600 198H975V226" stroke="url(#line)" stroke-width="3"/>

