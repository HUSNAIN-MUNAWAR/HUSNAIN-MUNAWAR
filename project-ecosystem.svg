  <path d="M225 576V612H600" stroke="#60A5FA" stroke-width="2.5"/>
  <path d="M600 576V612" stroke="#A78BFA" stroke-width="2.5"/>
  <path d="M975 576V612H600" stroke="#2DD4BF" stroke-width="2.5"/>

  <g filter="url(#shadow)">
