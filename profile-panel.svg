    <text x="748" y="75" fill="#A5B4FC" font-size="11" font-weight="700" letter-spacing="1.4">ROLE</text>
    <text x="748" y="94" fill="#F8FAFC" font-size="14" font-weight="700">AI Engineer · Computer Vision Engineer</text>

    <rect x="690" y="116" width="452" height="54" rx="16" fill="#111827" stroke="#22D3EE" stroke-opacity="0.55"/>
    <circle cx="724" cy="143" r="8" fill="#22D3EE"/>
    <text x="748" y="139" fill="#67E8F9" font-size="11" font-weight="700" letter-spacing="1.4">FOCUS</text>
    <text x="748" y="158" fill="#F8FAFC" font-size="14" font-weight="700">Visual intelligence · Agents · Production AI</text>

    <rect x="690" y="180" width="452" height="54" rx="16" fill="#111827" stroke="#14B8A6" stroke-opacity="0.55"/>
    <circle cx="724" cy="207" r="8" fill="#14B8A6"/>
    <text x="748" y="203" fill="#5EEAD4" font-size="11" font-weight="700" letter-spacing="1.4">APPROACH</text>
    <text x="748" y="222" fill="#F8FAFC" font-size="14" font-weight="700">Systems-first · Evidence-based · Product-minded</text>

    <rect x="690" y="244" width="452" height="54" rx="16" fill="#111827" stroke="#F59E0B" stroke-opacity="0.55"/>
    <circle cx="724" cy="271" r="8" fill="#F59E0B"/>
    <text x="748" y="267" fill="#FCD34D" font-size="11" font-weight="700" letter-spacing="1.4">MISSION</text>
