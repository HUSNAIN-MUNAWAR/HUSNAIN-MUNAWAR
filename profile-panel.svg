  <path d="M58 256H630" stroke="#FFFFFF" stroke-opacity="0.10"/>
  <text x="58" y="286" fill="#94A3B8" font-size="13" font-family="Arial, Helvetica, sans-serif">Working at the intersection of</text>
  <text x="58" y="310" fill="#F8FAFC" font-size="15" font-family="Arial, Helvetica, sans-serif" font-weight="700">perception  ×  intelligence  ×  operations</text>
